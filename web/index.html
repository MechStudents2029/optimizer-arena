<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>optimizer-arena · race</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>∇</text></svg>" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>optimizer-arena <span>2D race</span></h1>
      <p>
        Five optimizers start from the same point on a loss surface. Each one uses
        the learning rate that suits it best on that surface. Click the plot to
        move the start point.
      </p>
    </header>

    <form id="controls" autocomplete="off">
      <label>
        Surface
        <select id="surface"></select>
      </label>
      <label>
        Speed (steps / frame)
        <select id="speed">
          <option value="1">1</option>
          <option value="4" selected>4</option>
          <option value="16">16</option>
          <option value="64">64</option>
          <option value="256">256</option>
        </select>
      </label>
      <button id="replay" type="button">Replay</button>
      <span id="formula"></span>
    </form>

    <main>
      <canvas id="plot" width="640" height="640"></canvas>
      <table id="legend">
        <thead>
          <tr><th></th><th>optimizer</th><th>η</th><th>step</th><th>f</th><th>update rule</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <p id="note"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
